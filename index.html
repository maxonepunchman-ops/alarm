<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>H2O Tracker</title>
    
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow.js + COCO-SSD (Умная нейросеть для поиска объектов) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

    <canvas id="confetti"></canvas>

    <!-- Шапка -->
    <div class="header">
        <div class="header-left">
            <div class="top-badge streak" id="openStreakBtn" title="Календарь ударного режима">
                <span class="droplet-icon">💧</span> <span id="streakCount">0</span> дн.
            </div>
            <div class="top-badge" title="Дневная цель">
                🎯 <span id="headerGoal">2000</span> мл
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="openAiBtn" aria-label="AI Сканер">🤖</button>
            <button class="icon-btn settings-btn" id="openSettingsBtn" aria-label="Настройки">
                <svg viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49-.12-.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Статистика -->
    <div class="stats-container">
        <div class="ml-display-wrapper">
            <span class="ml-display" id="waterAmount">0</span>
            <span class="unit-label">мл</span>
        </div>
        <div class="percentage-display" id="percentAmount">0% выпито</div>
    </div>

    <!-- Интерактивный стакан + Анимация капли -->
    <div class="glass-wrapper" id="glassTapArea" onclick="handleGlassTap()">
        <div id="successDrop" class="success-drop">💧</div>
        <svg viewBox="0 0 300 500" class="glass-svg">
            <defs>
                <clipPath id="water-clip">
                    <polygon points="43,78 257,78 213,462 87,462" />
                </clipPath>
                <linearGradient id="water-grad" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.9" />
                    <stop offset="60%" stop-color="#2563eb" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7" />
                </linearGradient>
                <linearGradient id="glass-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
                    <stop offset="15%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="85%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
                </linearGradient>
            </defs>

            <ellipse cx="150" cy="470" rx="72" ry="12" fill="rgba(0,0,0,0.04)" />
            <polygon points="45,80 255,80 215,460 85,460" fill="rgba(255, 255, 255, 0.45)" />

            <g clip-path="url(#water-clip)">
                <rect id="water-fill" x="0" y="462" width="300" height="384" fill="url(#water-grad)" style="transition: y 0.8s cubic-bezier(0.25, 1, 0.5, 1);" />
                <ellipse id="water-surface" cx="150" cy="462" rx="65" ry="8" fill="#60a5fa" opacity="0.9" style="transition: cy 0.8s cubic-bezier(0.25, 1, 0.5, 1), rx 0.8s cubic-bezier(0.25, 1, 0.5, 1), ry 0.8s cubic-bezier(0.25, 1, 0.5, 1);" />
            </g>

            <path d="M 45,80 A 105,12 0 0 1 255,80" fill="none" stroke="rgba(46, 53, 63, 0.15)" stroke-width="1.5" />
            <line x1="45" y1="80" x2="85" y2="460" stroke="var(--text-main)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
            <line x1="255" y1="80" x2="215" y2="460" stroke="var(--text-main)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
            <ellipse cx="150" cy="460" rx="65" ry="8" fill="none" stroke="var(--text-main)" stroke-width="3.5" opacity="0.85" />
            <path d="M 45,80 A 105,12 0 0 0 255,80" fill="none" stroke="var(--text-main)" stroke-width="3" opacity="0.85" />
            <polygon points="48,83 252,83 213,457 87,457" fill="url(#glass-glow)" pointer-events="none" />
        </svg>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <div class="quick-add-row">
            <button class="btn-add" onclick="addWater(150)">+150</button>
            <button class="btn-add" onclick="addWater(250)">+250</button>
            <button class="btn-add" onclick="addWater(500)">+500</button>
            <button class="btn-add" onclick="addCustomWater()">+ Свой</button>
        </div>
        
        <div class="btn-secondary-row">
            <button class="btn-action" id="undoBtn" onclick="undoLastAction()" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                Отменить
            </button>
            <button class="btn-action btn-reset-danger" onclick="resetApp()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Сбросить
            </button>
        </div>
    </div>

    <!-- Календарь -->
    <div class="overlay" id="streakOverlay">
        <div class="sheet">
            <div class="sheet-header">
                <span class="sheet-title">Ударный режим 💧</span>
                <button class="sheet-close" id="closeStreakBtn">&times;</button>
            </div>
            
            <div class="streak-card">
                <div class="streak-big-icon">💧</div>
                <div class="streak-title"><span id="modalStreakCount">0</span> Дней подряд</div>
                <div class="streak-subtitle">Выполняйте норму воды каждый день!</div>
            </div>

            <div class="calendar-header" id="calendarMonthTitle">Месяц</div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Умный AI Сканер -->
    <div class="overlay" id="aiOverlay">
        <div class="sheet">
            <div class="sheet-header">
                <span class="sheet-title">AI Сканер 🤖</span>
                <button class="sheet-close" id="closeAiBtn">&times;</button>
            </div>
            
            <div class="scanner-box" id="scannerBox">
                <button id="clearPhotoBtn" class="clear-photo-btn" title="Убрать фото">&times;</button>
                <div class="scan-line" id="scanLine"></div>
                <img id="scannedImg" style="display:none;" crossorigin="anonymous">
                <div id="scannerPlaceholder">📸 Сделайте фото емкости с водой</div>
                <div class="ai-loading-text" id="aiLoadingText">Нейросеть сканирует...</div>
            </div>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processAiImage(event)">
            
            <button class="btn-primary" id="btnScanPhoto" onclick="document.getElementById('cameraInput').click()">Сфотографировать емкость</button>

            <div class="ai-result-card" id="aiResultCard">
                <div style="font-size:12px; color:#64748b; font-weight:700; text-transform:uppercase;" id="aiClassLabel">Распознанный объект</div>
                <div class="ai-result-val" id="aiResultVal">~0 мл</div>
                <button class="btn-primary" id="aiConfirmBtn" onclick="confirmAiWater()" style="background:#16a34a;">Добавить в счетчик</button>
            </div>
        </div>
    </div>

    <!-- Настройки -->
    <div class="overlay" id="settingsOverlay">
        <div class="sheet">
            <div class="sheet-header">
                <span class="sheet-title">Настройки</span>
                <button class="sheet-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="setting-item">
                <label style="font-size:14px; font-weight:600; color:var(--text-secondary);" for="dailyGoalInput">Дневная цель (мл)</label>
                <input type="number" id="dailyGoalInput" class="setting-input" min="500" max="10000" step="50">
            </div>
        </div>
    </div>

    <!-- Подключаем логику -->
    <script src="app.js"></script>
</body>
</html>
